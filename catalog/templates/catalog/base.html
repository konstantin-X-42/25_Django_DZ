<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>

    <style>
        /* Базовые настройки страницы */
        body {
            background-color: #ffffff;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Сайдбар зафиксирован слева */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #1e2125;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Основной контент с правильным отступом */
        .main-content {
            margin-left: 250px;
            padding: 40px;
            box-sizing: border-box;
        }

        .text-center { text-align: center; }
        .text-muted { color: #6c757d; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-5 { margin-bottom: 3rem; }
        .mt-4 { margin-top: 1.5rem; }

        .display-5 {
            font-size: 2.5rem;
            font-weight: 300;
        }

        /* Навигация (меню) */
        .nav {
            display: flex;
            flex-direction: column;
            padding-left: 0;
            margin-bottom: auto;
            list-style: none;
            gap: 5px;
        }
        .nav-link-custom {
            color: #adb5bd;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            font-size: 1rem;
        }
        .nav-link-custom:hover {
            color: white;
            background-color: rgba(255,255,255,0.05);
            border-radius: 6px;
        }
        .active-custom {
            background-color: #2f6bf2 !important;
            color: white !important;
            border-radius: 6px;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }

        hr { margin: 15px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.15); }
        .rounded-circle { border-radius: 50%; }

        /* ГОРИЗОНТАЛЬНАЯ СЕТКА ДЛЯ КАРТОЧЕК ТОВАРОВ */
        .products-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }
        .product-col {
            flex: 1 1 300px;
            max-width: 320px;
            box-sizing: border-box;
        }

        /* Стили карточек товаров */
        .card {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
            overflow: hidden;
            text-align: left;
        }
        .card-header {
            padding: 16px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .card-header h4 { margin: 0; font-size: 1.25rem; font-weight: 400; color: #6c757d; }
        .card-body { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 2.5rem; margin-top: 0; margin-bottom: 1.5rem; font-weight: 500; }
        .list-unstyled { list-style: none; padding-left: 0; margin-bottom: 1.5rem; color: #6c757d; font-size: 0.9rem; line-height: 1.6; }

        /* Кнопка купить / подробнее */
        .btn-outline-primary {
            color: #2f6bf2;
            background-color: transparent;
            border: 1px solid #2f6bf2;
            padding: 8px 16px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            display: block;
        }
        .btn-outline-primary:hover {
            color: #fff;
            background-color: #2f6bf2;
        }

        /* СТИЛИ ДЛЯ ВЫКАТНОГО МЕНЮ ПОЛЬЗОВАТЕЛЯ */
        .custom-dropup-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 12px;
            background-color: #343a40;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 5px 0;
            border-radius: 8px;
            list-style: none;
            min-width: 160px;
            z-index: 99999;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.175);
        }
        .custom-dropup-item {
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 8px 16px;
            font-size: 0.95rem;
        }
        .custom-dropup-item:hover { background-color: rgba(255,255,255,0.08); }
        .custom-dropup-divider { margin: 5px 0; border-top: 1px solid rgba(255,255,255,0.15); }

        .user-container-block {
            color: #ffffff !important;
            text-decoration: none !important;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            padding: 5px 0;
        }

        /* ДВУХКОЛОНОЧНАЯ СЕТКА КАТАЛОГА */
        .catalog-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .catalog-col {
            flex: 1 1 450px;
            max-width: 480px;
            box-sizing: border-box;
        }

        /* Стили больших карточек с Thumbnail */
        .catalog-card {
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.05);
            text-align: left;
        }
        .thumbnail-box {
            background-color: #6c757d;
            color: #dee2e6;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        .catalog-body {
            padding: 20px;
            text-align: left;
        }
        .catalog-text {
            font-size: 0.95rem;
            color: #212529;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .catalog-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-group {
            display: flex;
        }
        .btn-card {
            background-color: #fff;
            color: #6c757d;
            border: 1px solid #6c757d;
            padding: 6px 12px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-view {
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            border-right: none;
        }
        .btn-edit {
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }
        .btn-card:hover {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Включаем подшаблон меню сайдбара (Задание 3) -->
    {% include 'catalog/includes/menu.html' %}

    <!-- Сюда вставляется динамический контент страниц -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
