        <!-- Категории -->

        </li>
        <!-- Заказы -->
        <li>
            <a href="{% url 'catalog:21-2_home3' %}" class="{% if request.resolver_match.url_name == '21-2_home3' %}active-custom{% else %}nav-link-custom{% endif %}">Заказы</a>

    <!-- БЛОК ПОЛЬЗОВАТЕЛЯ -->

            <li><a class="custom-dropup-item" href="#">Профиль</a></li>

            <li><a class="custom-dropup-item" href="#" style="color: #ea868f;">Выход</a></li>
        </ul>

        <div class="user-container-block" id="dropdownUser">
            <img src="https://a1.drive-data.ru/1b1c92es-960.jpg" alt="user" width="32" height="32" class="rounded-circle" style="object-fit: cover; border-radius: 50%;">
            <strong class="ms-1">Пользователь<sup style="font-size: 0.6rem; margin-left: 3px; color: #ffffff; vertical-align: super;">▲</sup></strong>
        </div>
    </div>
</div>

<script>
    document.getElementById('dropdownUser').addEventListener('click', function(e) {
        e.stopPropagation();
        var menu = document.getElementById('dropdownMenu');
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    });
    document.addEventListener('click', function() {
        document.getElementById('dropdownMenu').style.display = 'none';
    });
</script>
